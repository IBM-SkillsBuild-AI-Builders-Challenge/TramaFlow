<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo oscuro moderno -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <!-- Gradiente de las conexiones (edges) -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Rectángulo de fondo redondeado -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Conexiones / Edges (Representando las ramas de la historia) -->
  <path d="M 256 360 C 256 250, 150 250, 150 160" fill="none" stroke="url(#lineGrad)" stroke-width="24" stroke-linecap="round" />
  <path d="M 256 360 C 256 250, 362 250, 362 160" fill="none" stroke="url(#lineGrad)" stroke-width="24" stroke-linecap="round" />

  <!-- Nodos de React Flow -->
  <!-- Nodo Base (Inicio) -->
  <circle cx="256" cy="360" r="48" fill="#ffffff" />
  <circle cx="256" cy="360" r="20" fill="#4c1d95" />

  <!-- Nodo Izquierdo (Opción A) -->
  <circle cx="150" cy="160" r="40" fill="#ffffff" />
  <circle cx="150" cy="160" r="16" fill="#38bdf8" />

  <!-- Nodo Derecho (Opción B) -->
  <circle cx="362" cy="160" r="40" fill="#ffffff" />
  <circle cx="362" cy="160" r="16" fill="#818cf8" />

  <!-- Chispa de Inteligencia Artificial (AI Star) -->
  <path d="M 256 50 L 266 90 L 306 100 L 266 110 L 256 150 L 246 110 L 206 100 L 246 90 Z" fill="#fbbf24" />
</svg>
